name: Build D2R Mobile IPA
run-name: "${{ inputs.prepare_only && 'Verify toolchain and prime caches' || 'Build unsigned IPA' }}"
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Release (disable for build validation)
        type: boolean
        default: true
      prepare_only:
        description: Verify toolchain and prime caches without building a game IPA
        type: boolean
        default: false
      input_revision:
        description: Game input cache revision (change when replacing source files)
        type: string
        default: game-3.3.94012-v1
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: true
      prepare_only:
        type: boolean
        default: false
      input_revision:
        type: string
        default: game-3.3.94012-v1
      native_build:
        type: boolean
        default: false
      source_repository:
        type: string
        default: jhaizhou-ops/d2r-mobile
      source_ref:
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: d2r-build
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_BUILD: ${{ inputs.native_build && '1' || '0' }}
      SOURCE_REPOSITORY: ${{ inputs.source_repository || 'jhaizhou-ops/d2r-mobile' }}
      DM_ROOT: ${{ github.workspace }}/.dm-work
      INPUT_REVISION: ${{ inputs.input_revision }}
      D2RM_NO_METAL: '1'
      PYTHONUTF8: '1'
      J: '2'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate repository and cache inputs
        env:
          INPUT_REVISION: ${{ inputs.input_revision }}
        run: |
          [[ "$INPUT_REVISION" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || exit 1
          python -m unittest discover -s tests -v
      - name: Resolve pinned upstream inputs
        id: pin
        run: |
          python - <<'PYCODE'
          import json, os, re, sys
          config = json.load(open('build-config.json'))
          commit = config['upstream_commit']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              print('::error::build-config.json upstream_commit must be a full 40-character commit SHA', file=sys.stderr)
              raise SystemExit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'commit={commit}\n')
          print('Pinned upstream commit:', commit)
          print('Game version:', config['game_version'])
          PYCODE
      - name: Checkout matching upstream release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.source_repository || 'jhaizhou-ops/d2r-mobile' }}
          ref: ${{ inputs.source_ref || steps.pin.outputs.commit }}
          path: upstream
          persist-credentials: false
      - name: Record selected source and apply local test patches
        if: inputs.native_build
        run: python scripts/source/configure.py
      - name: Make room for game extraction on the disposable runner
        run: |
          # Only remove unrelated preinstalled SDKs on GitHub's temporary VM.
          sudo rm -rf /usr/local/lib/android /usr/share/swift /usr/local/.ghcup /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          python - <<'PYCODE'
          import shutil
          free = shutil.disk_usage('.').free / 1024**3
          print(f'Free disk space: {free:.1f} GiB')
          if free < 28:
              raise SystemExit('Insufficient disk space: game extraction needs at least 28 GiB free')
          PYCODE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install compiler and archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build p7zip-full p7zip-rar aria2 fonts-dejavu-core libjpeg-dev zlib1g-dev libfreetype6-dev libraqm-dev
          python -m pip install -r requirements.txt
          df -h "$GITHUB_WORKSPACE"
      - name: Compute dependency cache keys
        id: cache-keys
        run: python scripts/cache_keys.py
      - name: Restore build tools
        id: tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-keys.outputs.tools }}
      - name: Restore generated build cache
        id: generated
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dm-work/build/cache/dm/out
            upstream/dm/ios/Gen/assets
            upstream/dm/ios/Sources/TouchArt
            upstream/dm/ios/Sources/dm_touch_native_art.c
          key: generated-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-config.json', 'requirements.txt', 'scripts/tools.sh', 'scripts/png_backend.sh') }}-${{ inputs.input_revision }}-${{ inputs.prepare_only && 'tools' || 'full' }}
          restore-keys: |
            generated-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-config.json', 'requirements.txt', 'scripts/tools.sh', 'scripts/png_backend.sh') }}-${{ inputs.input_revision }}-
      - name: Build and verify toolchain
        run: |
          bash scripts/tools.sh
          python upstream/dm/gfx/tools/nometal_run.py upstream/dm/gfx/tools/dmsh_chain.py --header
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Compute verified shader cache key
        id: shader-key
        run: python scripts/cache_keys.py shaders
      - name: Restore matching shader outputs
        id: shaders
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dm-work/build/cache/dm/dmsh
            .dm-work/build/cache/metal_shader_cache
            .dm-work/build/ios/dmsh_b
          key: shaders-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.shader-key.outputs.shaders }}
      - name: Restore PNG compression backend
        id: png
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: png-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/png_backend.sh') }}
      - name: Pin the verified PNG compression backend
        run: |
          bash scripts/png_backend.sh
          LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1" python - <<'PY'
          from PIL import features
          assert features.version('zlib') == '1.3.1.zlib-ng', features.version('zlib')
          print('Verified PNG compressor:', features.version('zlib'))
          PY
      - name: Save PNG compression backend
        if: steps.png.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tools/png-zlib-ng-2.3.2
          key: ${{ steps.png.outputs.cache-primary-key }}
      - name: Save verified build tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools
          key: ${{ steps.tools.outputs.cache-primary-key }}
      # The extracted game payload is deliberately not cached: at roughly the same
      # size as the download cache it cannot coexist with it inside GitHub's 10 GB
      # per-repository budget, so caching it would evict the downloads and force a
      # full re-download on every run. The raw downloads are cached instead.
      - name: Restore complete original downloads
        if: ${{ !inputs.prepare_only }}
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .game-downloads
          key: downloads-${{ runner.os }}-${{ inputs.input_revision }}
      - name: Download game packages without decrypting
        if: ${{ !inputs.prepare_only }}
        env:
          GAME_INPUT_MANIFEST: ${{ secrets.GAME_INPUT_MANIFEST }}
        run: python scripts/ci.py downloads
      - name: Cache complete downloads BEFORE extraction
        if: ${{ !inputs.prepare_only && steps.downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .game-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Confirm original downloads are stored before extraction
        if: ${{ !inputs.prepare_only }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .game-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Decrypt, extract and verify cached game inputs
        if: ${{ !inputs.prepare_only }}
        env:
          GAME_INPUT_MANIFEST: ${{ secrets.GAME_INPUT_MANIFEST }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: python scripts/ci.py inputs
      - name: Verify frozen PNG hashes
        if: ${{ !inputs.prepare_only }}
        run: |
          export LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1"
          mkdir -p outputs
          python -u scripts/png_preflight.py
      - name: Generate or reuse matching Legacy Device Pack
        if: ${{ !inputs.prepare_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/legacy_pack.py
      - name: Generate both unsigned IPA variants
        id: ipas
        if: ${{ !inputs.prepare_only }}
        run: |
          export LD_PRELOAD="$GITHUB_WORKSPACE/.tools/png-zlib-ng-2.3.2/lib/libz.so.1"
          if [[ "$SOURCE_BUILD" == 1 ]]; then
            python -u scripts/source/prepare.py
          else
            python -u scripts/build_ipas.py
          fi
      - name: Save generated build cache
        if: success() && steps.generated.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .dm-work/build/cache/dm/out
            upstream/dm/ios/Gen/assets
            upstream/dm/ios/Sources/TouchArt
            upstream/dm/ios/Sources/dm_touch_native_art.c
          key: ${{ steps.generated.outputs.cache-primary-key }}
      - name: Save verified shader outputs
        if: success() && !inputs.prepare_only && steps.shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .dm-work/build/cache/dm/dmsh
            .dm-work/build/cache/metal_shader_cache
            .dm-work/build/ios/dmsh_b
          key: ${{ steps.shaders.outputs.cache-primary-key }}
      - name: Reuse matching Data or publish it once
        if: ${{ !inputs.prepare_only && inputs.publish_release && !inputs.native_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_release.py prepare-resources
      - name: Upload native source build inputs
        if: inputs.native_build && !inputs.prepare_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-inputs
          path: |
            outputs/native-inputs.tar.gz
            outputs/source-payload.zip
            outputs/source-input-report.json
            outputs/legacy-resources.json
            outputs/build-config.json
          retention-days: 3
          compression-level: 0
      - name: Upload IPA and verification report
        if: ${{ !inputs.prepare_only && !inputs.native_build }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: D2RMobile-${{ steps.ipas.outputs.version }}-${{ github.run_number }}
          path: |
            outputs/D2RMobile-*.ipa
            outputs/legacy-resources.json
            outputs/build-report.json
            outputs/SHA256SUMS.txt
            outputs/resource-manifest.json
            outputs/resources.json
            outputs/RESOURCE-INSTALL.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Automatically publish IPA with matching Data links
        if: ${{ !inputs.prepare_only && inputs.publish_release && !inputs.native_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u scripts/publish_release.py ipa
      - name: Collect sanitized failure diagnostics
        if: failure()
        run: python scripts/ci.py diagnostics
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: outputs/diagnostics/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload PNG compatibility diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: png-compat-${{ github.run_number }}
          path: outputs/png-compat/
          if-no-files-found: ignore
          retention-days: 1
      - name: Report result
        if: success()
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          DOWNLOAD_CACHE_HIT: ${{ steps.downloads.outputs.cache-hit }}
          GENERATED_CACHE_HIT: ${{ steps.generated.outputs.cache-hit }}
          SHADER_CACHE_HIT: ${{ steps.shaders.outputs.cache-hit }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          SOURCE_BUILD: ${{ inputs.native_build }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              if os.environ['PREPARE_ONLY'] == 'true':
                  f.write('Toolchain verified and cached. **No game IPA was built in this preparation run.**\n')
              elif os.environ['SOURCE_BUILD'] == 'true':
                  f.write('Matching game payload and native source inputs verified; macOS compiles the App next.\n')
              else:
                  f.write('Unsigned IPA built and verified; see the artifact and build-report.json.\n')
                  f.write('Original download cache hit: ' + os.environ['DOWNLOAD_CACHE_HIT'] + '\n\n')
                  f.write('Generated cache hit: ' + os.environ['GENERATED_CACHE_HIT'] + '\n\n')
                  f.write('Shader cache hit: ' + os.environ['SHADER_CACHE_HIT'] + '\n\n')
                  f.write('Release publication enabled: ' + os.environ['PUBLISH_RELEASE'] + '\n')
          PY
